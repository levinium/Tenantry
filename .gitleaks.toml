# gitleaks reads this from the repository root. It keeps every default rule and adds reviewed
# path exemptions; single findings go in .gitleaksignore instead.
[extend]
useDefault = true

[allowlist]
description = "Reviewed: public data with no credentials"
paths = [
  # Microsoft's published license table (product GUIDs and names), regenerated by
  # tools/update-license-names.py. Its GUIDs trip the generic-api-key rule.
  '''src/Tenantry\.Core/Licensing/license-names\.json''',
]
