name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Standard runners only; GitHub's larger runners are billed even on public repos.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Tenantry.slnx -c Release --verbosity normal

  # Secrets scan over the whole history. The private-term denylist is deliberately NOT here:
  # its terms are the sensitive data, so it lives only on developer machines and is enforced
  # by the hooks in tools/hooks.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned binary over the full history, rather than gitleaks-action: the action scans
      # "<first pushed commit>^..HEAD", which errors on a repository's first push (no parent).
      - name: Scan history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
